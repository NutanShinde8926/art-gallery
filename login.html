 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Login | Art Gallery</title>
</head>
<body class="auth-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="auth-card">
          <div class="text-center mb-4">
            <h2>Welcome Back</h2>
            <p class="text-muted mb-0">Sign in to continue exploring art</p>
          </div>

          <form action="index.html" class="was-validated">
            <div class="mb-3">
              <label for="uname" class="form-label">Username</label>
              <input type="text" class="form-control" id="uname" placeholder="Enter username" name="uname" required>
              <div class="invalid-feedback">Please enter your username.</div>
            </div>

            <div class="mb-3">
              <label for="pwd" class="form-label">Password</label>
              <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd" required>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="rememberMe" name="remember">
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="btn btn-warning w-100">Login</button>
          </form>

          <div class="text-center mt-3">
            <p class="mb-0">New here? <a href="signup.html">Create an account</a></p>
            <a href="index.html" class="d-inline-block mt-2">Back to home</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
