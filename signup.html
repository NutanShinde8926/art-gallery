<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Sign Up | Art Gallery</title>
</head>
<body class="auth-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="auth-card">
          <div class="text-center mb-4">
            <h2>Create Your Account</h2>
            <p class="text-muted mb-0">Join our creative community</p>
          </div>

          <form action="index.html" class="was-validated">
            <div class="mb-3">
              <label for="fullname" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullname" name="fullname" required>
              <div class="invalid-feedback">Please enter your name.</div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" required>
              <div class="invalid-feedback">Please enter a valid email.</div>
            </div>

            <div class="mb-3">
              <label for="pwd" class="form-label">Password</label>
              <input type="password" class="form-control" id="pwd" name="pswd" required>
              <div class="invalid-feedback">Please choose a password.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Your Art Interests</label>
              <div class="row g-2">
                <div class="col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="int1" name="interests" value="Painting">
                    <label class="form-check-label" for="int1">Painting</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="int2" name="interests" value="Sculpture">
                    <label class="form-check-label" for="int2">Sculpture</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="int3" name="interests" value="Photography">
                    <label class="form-check-label" for="int3">Photography</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="int4" name="interests" value="Digital Art">
                    <label class="form-check-label" for="int4">Digital Art</label>
                  </div>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-warning w-100">Sign Up</button>
          </form>

          <div class="text-center mt-3">
            <p class="mb-0">Already have an account? <a href="login.html">Log in</a></p>
            <a href="index.html" class="d-inline-block mt-2">Back to home</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
